# Phase 2 : HTTPS complet. À activer (NGINX_CONFIG=https dans .env) une fois le certificat obtenu.
# ${NGINX_SERVER_NAMES} et ${NGINX_CERT_NAME} sont remplacés au démarrage du conteneur.

server {
    listen 80;
    server_name ${NGINX_SERVER_NAMES};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${NGINX_SERVER_NAMES};

    ssl_certificate     /etc/letsencrypt/live/${NGINX_CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NGINX_CERT_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS : à activer dans snippets/security-headers.conf une fois HTTPS validé (section 12.5).

    include /etc/nginx/snippets/procad-app.conf;
}
