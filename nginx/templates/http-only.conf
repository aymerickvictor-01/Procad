# Phase 1 : HTTP seul (test en local, ou avant d'avoir le certificat Let's Encrypt).
# ${NGINX_SERVER_NAMES} est remplacé au démarrage du conteneur (variable du fichier .env).

server {
    listen 80;
    server_name ${NGINX_SERVER_NAMES};

    # Défi HTTP-01 de Let's Encrypt (obtention du certificat)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/procad-app.conf;
}
