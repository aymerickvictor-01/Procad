# Routes de l'application, communes aux configurations HTTP seul et HTTPS.

include /etc/nginx/snippets/security-headers.conf;
server_tokens off;
client_max_body_size 25M;    # images de 5 Mo maximum côté Django, plus la marge du formulaire

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# --- API et administration Django ------------------------------------------------
location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Le dernier élément est l'IP vue par Nginx : DJANGO_NUM_PROXIES=1 l'utilise pour la limitation de débit.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /django-admin/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Fichiers servis directement par Nginx -------------------------------------------
# Fichiers statiques de Django (admin, DRF), produits par collectstatic.
location /static/ {
    alias /var/www/static/;
    expires 30d;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public";
}

# Images téléversées : noms uniques (UUID), donc mises en cache longtemps. Rien n'y est exécuté.
location /media/ {
    alias /var/www/media/;
    expires 30d;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public";
}

# Fichiers compilés par Vite : leur nom contient une empreinte, ils ne changent jamais.
location /assets/ {
    root /usr/share/nginx/html;
    expires max;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# --- Application React (SPA) ---------------------------------------------------------
root /usr/share/nginx/html;
index index.html;

location = /index.html {
    # Toujours revalidé : il référence les fichiers /assets/ de la dernière version.
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
}

location / {
    try_files $uri /index.html;    # les routes React (/services, /admin...) renvoient index.html
}
