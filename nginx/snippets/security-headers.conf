# En-têtes de sécurité communs. Inclus dans chaque bloc qui ajoute ses propres en-têtes :
# Nginx n'hérite pas des add_header d'un niveau supérieur dès qu'un bloc en définit un.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS : décommenter seulement après avoir vérifié que HTTPS fonctionne partout (section 12.5).
# Ignoré par les navigateurs tant que le site est servi en HTTP.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
