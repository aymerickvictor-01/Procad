# Environnement de DÉVELOPPEMENT : db, pgadmin, backend, frontend.
# Installation sur un nouvel ordinateur : scripts/installer.ps1 (Windows) ou scripts/installer.sh.
# Ensuite : docker compose up -d
#
# Ports côté PC modifiables dans .env (DB_PORT, PGADMIN_PORT, BACKEND_PORT, FRONTEND_PORT)
# si l'un d'eux est déjà pris sur la machine.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 par défaut : évite le conflit avec un PostgreSQL déjà installé sur le PC
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Serveur PROCAD pré-enregistré (lu au premier démarrage de pgAdmin)
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db

  backend:
    build: ./backend
    # Base à jour et table de cache créée à chaque démarrage, puis serveur de développement.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    volumes:
      - ./backend:/app # rechargement automatique du code
      - media_data:/app/media
      - private_data:/app/private # pièces jointes des devis (jamais publiques)
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules # garde les modules installés dans le conteneur
    ports:
      # 5174 par défaut (le 5173 habituel de Vite est souvent pris par un autre projet)
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5174"
    depends_on:
      - backend

volumes:
  pgdata:
  pgadmin_data:
  media_data:
  private_data:
